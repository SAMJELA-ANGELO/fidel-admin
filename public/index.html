<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <!-- SEO Meta Tags -->
    <meta name="description" content="Fidel Admin Portal - Professional e-commerce management dashboard. Manage products, orders, categories, and analytics with our modern Vue.js admin interface.">
    <meta name="keywords" content="admin dashboard, ecommerce management, vue.js admin, product management, order management, inventory system, fidel admin, store management, business dashboard">
    <meta name="author" content="Fidel Team">
    <meta name="robots" content="index, follow">
    <meta name="language" content="English">
    <meta name="revisit-after" content="7 days">
    <meta name="distribution" content="global">
    <meta name="rating" content="general">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://yourdomain.com/">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="Fidel Admin Portal - E-commerce Management Dashboard">
    <meta property="og:description" content="Professional e-commerce management dashboard. Manage products, orders, categories, and analytics with our modern Vue.js admin interface.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yourdomain.com/">
    <meta property="og:image" content="https://yourdomain.com/logo.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Fidel Admin Portal">
    <meta property="og:locale" content="en_US">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Fidel Admin Portal - E-commerce Management Dashboard">
    <meta name="twitter:description" content="Professional e-commerce management dashboard. Manage products, orders, categories, and analytics with our modern Vue.js admin interface.">
    <meta name="twitter:image" content="https://yourdomain.com/logo.png">
    <meta name="twitter:site" content="@fidelteam">
    <meta name="twitter:creator" content="@fidelteam">
    
    <!-- Additional Meta Tags -->
    <meta name="application-name" content="Fidel Admin Portal">
    <meta name="msapplication-TileColor" content="#3b82f6">
    <meta name="msapplication-config" content="browserconfig.xml">
    <meta name="theme-color" content="#3b82f6">
    <meta name="color-scheme" content="light dark">
    
    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- DNS Prefetch for API -->
    <link rel="dns-prefetch" href="https://fidel-of6u.onrender.com">
    
    <!-- Structured Data / JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Fidel Admin Portal",
      "description": "Professional e-commerce management dashboard for managing products, orders, and store operations.",
      "url": "https://yourdomain.com/",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Organization",
        "name": "Fidel Team"
      },
      "publisher": {
        "@type": "Organization",
        "name": "Fidel Team"
      }
    }
    </script>
    <!-- Primary favicon -->
    <link rel="icon" href="<%= BASE_URL %>favicon.png?v=2" type="image/png" sizes="32x32">
    
    <!-- Alternative favicon formats -->
    <link rel="icon" href="<%= BASE_URL %>logo.png?v=2" type="image/png" sizes="32x32">
    <link rel="shortcut icon" href="<%= BASE_URL %>favicon.png?v=2" type="image/png">
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="<%= BASE_URL %>logo.png?v=2" sizes="180x180">
    
    <!-- Windows Tile -->
    <meta name="msapplication-TileImage" content="<%= BASE_URL %>logo.png?v=2">
    <title><%= htmlWebpackPlugin.options.title %></title>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
