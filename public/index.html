<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    
    <!-- Enhanced SEO Meta Tags -->
    <meta name="description" content="Fidel Admin Portal - Professional e-commerce management dashboard. Manage products, orders, categories, and analytics with our modern Vue.js admin interface.">
    <meta name="keywords" content="admin dashboard, ecommerce management, vue.js admin, product management, order management, inventory system, fidel admin, store management, business dashboard">
    <meta name="author" content="Fidel Team">
    <meta name="robots" content="index, follow">
    <meta name="language" content="English">
    <meta name="revisit-after" content="7 days">
    <meta name="distribution" content="global">
    <meta name="rating" content="general">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://fidel-admin.netlify.app/">
    
    <!-- Enhanced Open Graph / Facebook -->
    <meta property="og:title" content="Fidel Admin Portal - E-commerce Management Dashboard">
    <meta property="og:description" content="Professional e-commerce management dashboard. Manage products, orders, categories, and analytics with our modern Vue.js admin interface.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://fidel-admin.netlify.app/">
    <meta property="og:image" content="https://fidel-admin.netlify.app/logo.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Fidel Admin Portal">
    <meta property="og:locale" content="en_US">
    
    <!-- Enhanced Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Fidel Admin Portal - E-commerce Management Dashboard">
    <meta name="twitter:description" content="Professional e-commerce management dashboard. Manage products, orders, categories, and analytics with our modern Vue.js admin interface.">
    <meta name="twitter:image" content="https://fidel-admin.netlify.app/logo.png">
    <meta name="twitter:site" content="@fidelteam">
    <meta name="twitter:creator" content="@fidelteam">
    
    <!-- Additional Meta Tags -->
    <meta name="application-name" content="Fidel Admin Portal">
    <meta name="msapplication-TileColor" content="#3b82f6">
    <meta name="msapplication-config" content="browserconfig.xml">
    <meta name="theme-color" content="#3b82f6">
    <meta name="color-scheme" content="light dark">
    <!-- PrimeVue UMD and styles -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/primevue/4.3.7/themes/saga-blue/theme.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/primevue/4.3.7/primevue.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/primeicons/6.0.0/primeicons.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/primevue/4.3.7/umd/primevue.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/primeicons/6.0.0/primeicons.min.js"></script>
    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- DNS Prefetch for API -->
    <link rel="dns-prefetch" href="https://fidel-of6u.onrender.com">
    
    <!-- Resource hints for better performance -->
    <link rel="preload" href="<%= BASE_URL %>logo.png" as="image" type="image/png">
    <link rel="preload" href="<%= BASE_URL %>favicon.png" as="image" type="image/png">
    
    <!-- Preload critical CSS -->
    
    <!-- Cache control headers for static assets -->
    <meta http-equiv="Cache-Control" content="public, max-age=31536000">
    <meta http-equiv="Expires" content="31536000">
    
    <!-- Security headers for better SEO trust -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    
    <!-- Structured Data / JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Fidel Admin Portal",
      "description": "Professional e-commerce management dashboard for managing products, orders, and store operations.",
      "url": "https://fidel-admin.netlify.app/",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Organization",
        "name": "Fidel Team"
      },
      "publisher": {
        "@type": "Organization",
        "name": "Fidel Team"
      }
    }
    </script>
    
    <!-- Primary favicon -->
    <link rel="icon" href="<%= BASE_URL %>favicon.png?v=2" type="image/png" sizes="32x32">
    
    <!-- Alternative favicon formats -->
    <link rel="icon" href="<%= BASE_URL %>logo.png?v=2" type="image/png" sizes="32x32">
    <link rel="shortcut icon" href="<%= BASE_URL %>favicon.png?v=2" type="image/png">
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="<%= BASE_URL %>logo.png?v=2" sizes="180x180">
    
    <!-- Windows Tile -->
    <meta name="msapplication-TileImage" content="<%= BASE_URL %>logo.png?v=2">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="<%= BASE_URL %>manifest.json">
    
    <!-- Mobile App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Fidel Admin">
    
    <title><%= htmlWebpackPlugin.options.title %></title>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
